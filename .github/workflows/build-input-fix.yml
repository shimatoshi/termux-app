name: Build input latency fix
on:
  push:
    branches: [fix-input-lag]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APKs
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          PACKAGE_VARIANT: apt-android-7
        run: |
          export TERMUX_APP_VERSION_NAME="0.119.0-inputfix"
          export TERMUX_APK_VERSION_TAG="inputfix-apt-android-7-github-debug"
          ./gradlew assembleDebug
          ls -lh app/build/outputs/apk/debug/
      - name: Attach APKs
        uses: actions/upload-artifact@v6
        with:
          name: termux-input-fix-apks
          path: app/build/outputs/apk/debug/*.apk
